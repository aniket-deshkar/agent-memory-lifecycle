[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "agent-memory-lifecycle"
version = "0.1.0"
description = "Scoped persistence, expiry, deduplication, and retrieval budgets for agent memory."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_lifecycle"]
[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
